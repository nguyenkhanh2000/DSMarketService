name: Build DSMarket .NET 10

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore DSMarketService.sln --configfile NuGet.Config
      - name: Build Release
        run: dotnet build DSMarketService.sln -c Release --no-restore
      - name: Publish API
        run: dotnet publish src/DSMarketService/DSMarketService.csproj -c Release -o publish --no-restore
      - name: Verify API routing and Kafka registration
        run: |
          python tools/verify_source.py
          python tools/verify_redis_routing.py
          python tools/verify_global_logging.py
      - name: Upload publish package
        uses: actions/upload-artifact@v4
        with:
          name: dsmarket-net10-publish
          path: publish/
